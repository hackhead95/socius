name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Build single-file artifact
        run: npm run build:artifact
      - uses: actions/upload-artifact@v4
        with:
          name: socius-single-file
          path: dist-artifact/socius.html
