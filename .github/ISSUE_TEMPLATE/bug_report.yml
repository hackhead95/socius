name: Something is not working
description: Report a problem, a wrong result, or an error message.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Socius. Please do not attach confidential or identifiable research data.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to repeat it
      placeholder: "1. Open the sample survey\n2. Analyze > Descriptive Statistics > Crosstabs...\n3. ..."
  - type: textarea
    id: error-report
    attributes:
      label: "Error report (Help > Error log > Copy report)"
      description: In Socius, open Help > Error log, click Copy report and paste it here. It lists error messages and technical details only, never your data values, variable names or keys. If you came from Socius's feedback dialog, a short summary is already filled in.
      render: text
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Chrome on Windows laptop
  - type: textarea
    id: extra
    attributes:
      label: Screenshot or anything else
      description: You can paste a screenshot here.
